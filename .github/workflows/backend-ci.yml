name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bc_copilot
          POSTGRES_USER: bc_copilot
          POSTGRES_PASSWORD: bc_copilot_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bc_copilot -d bc_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://bc_copilot:bc_copilot_ci_password@localhost:5432/bc_copilot
      APP_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest -q
