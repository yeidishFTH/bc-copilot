services:
  postgres:
    image: postgres:16-alpine
    container_name: bc-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bc_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-bc_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bc_copilot_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bc_copilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bc_copilot} -d ${POSTGRES_DB:-bc_copilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  bc_copilot_postgres_data:
    name: bc_copilot_postgres_data
